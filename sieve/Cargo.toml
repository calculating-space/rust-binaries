[package]
name = "sieve"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Context governor for agent sessions: a bounded command runner that spills full output to disk"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
