name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Apple Silicon runner: the tools target the Mac and trybox's tests build a real uv sandbox.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install uv
      - name: build and test every package
        run: |
          for pkg in cs speccheck trybox; do
            cargo test --release --manifest-path "$pkg/Cargo.toml"
          done
