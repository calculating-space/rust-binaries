[package]
name = "grindreport"
version = "0.1.0"
edition = "2021"
description = "Reads a grindstone dataset and renders a usage report: text, Markdown for agents, self-contained HTML, or JSON"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow = "57"
parquet = { version = "57", features = ["arrow"] }
chrono = "0.4"
chrono-tz = "0.10"
toml = "0.8"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
