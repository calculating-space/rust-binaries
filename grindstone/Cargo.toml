[package]
name = "grindstone"
version = "0.1.0"
edition = "2021"
description = "Turns Claude Code session transcripts into a Parquet metrics dataset"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow = "57"
parquet = { version = "57", features = ["arrow"] }
rayon = "1"
sha2 = "0.10"
anyhow = "1"
thiserror = "2"
chrono = "0.4"
iana-time-zone = "0.1"

[profile.release]
lto = "thin"
