[package]
name = "trybox"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Explore a project: recipe man page, requirements check, disposable sandbox, guided tour, resident agent"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
speccheck = { path = "../speccheck" }

[dev-dependencies]
tempfile = "3"
