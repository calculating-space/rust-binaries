[package]
name = "oneshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Hand a prompt to an agent, get its result back: text on stdout or a JSON record with cost, turns and exit status"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
