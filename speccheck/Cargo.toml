[package]
name = "speccheck"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Capture a machine's spec and check it against a requirements matrix: can it run, and does it make sense"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
